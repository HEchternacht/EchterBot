[project]
name = "wsp"
version = "0.1.0"
description = "WhatsApp Echo Bot - Receives WhatsApp messages and echoes them back via Kapso API"
requires-python = ">=3.8"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.32.0",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
